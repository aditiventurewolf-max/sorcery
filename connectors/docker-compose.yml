services:
  metabase-mcp:
    build: ./metabase-mcp
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - ./metabase-mcp/.env

  whatsapp-mcp:
    build: ./whatsapp-mcp
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file:
      - ./whatsapp-mcp/.env
    volumes:
      - whatsapp-session:/data

volumes:
  whatsapp-session:
